<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node + Mongo Manager</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #2c3e50; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #219150; }
    ul { list-style-type: none; padding: 0; }
    li { background: #eef2f5; padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #27ae60; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Item Manager</h1>
    <div class="input-group">
      <input type="text" id="itemName" placeholder="Enter item name..." />
      <button onclick="addItem()">Add Item</button>
    </div>
    <h3>Items in Database:</h3>
    <ul id="itemList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
